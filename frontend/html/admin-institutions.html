<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKCET Admin — Institutions</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .inst-table td { white-space:normal;word-break:break-word;vertical-align:top; }
    .inst-table { table-layout:fixed; }
    .inst-table col.col-name   { width:24%; }
    .inst-table col.col-status { width:11%; }
    .inst-table col.col-sub    { width:12%; }
    .inst-table col.col-stud   { width:8%; }
    .inst-table col.col-quest  { width:8%; }
    .inst-table col.col-exams  { width:8%; }
    .inst-table col.col-renew  { width:12%; }
    .inst-table col.col-acts   { width:17%; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
      <span class="brand-name">SmartKCET<span class="brand-ai">Admin</span></span>
    </div>
    <div class="nav-links">
      <a href="/admin/dashboard" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard
      </a>
      <a href="/admin/institutions" class="nav-pill active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Institutions
      </a>
      <a href="/admin/upload" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload
      </a>
      <a href="/admin/questions" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Questions
      </a>
      <a href="/admin/exams" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Exams
      </a>
      <a href="/admin/syllabus" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Syllabus
      </a>
      <a href="/admin/subscriptions" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Subscriptions
      </a>
      <a href="/admin/analytics" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Analytics
      </a>
    </div>
    <div class="nav-actions">
      <a href="/admin/dashboard" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Dashboard
      </a>
      <a href="#" class="nav-pill" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout
      </a>
    </div>
  </nav>

  <div class="main-wrap" style="max-width:100%;padding:24px 28px 80px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:1.6rem;font-weight:800;margin:0 0 3px;">Institution Management</h1>
        <p style="color:var(--muted);margin:0;font-size:0.82rem;">Activate, suspend, view details and monitor all institutions</p>
      </div>
      <button class="btn-outline" id="refreshBtn" style="display:flex;align-items:center;gap:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>

    <div class="section-card">
      <div class="section-body" style="padding-bottom:0;">
        <!-- Filters -->
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <div class="input-group" style="margin:0;">
            <label class="input-label" for="filterStatus">Status</label>
            <select id="filterStatus" class="text-input">
              <option value="">All</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="overdue">Overdue</option>
              <option value="grace_period">Grace Period</option>
              <option value="expired">Expired</option>
            </select>
          </div>

        </div>
      </div>

      <div class="section-body" style="padding:0;">
        <div class="table-scroll">
          <table class="results-table inst-table">
            <colgroup>
              <col class="col-name"/><col class="col-status"/><col class="col-sub"/>
              <col class="col-stud"/><col class="col-quest"/><col class="col-exams"/>
              <col class="col-renew"/><col class="col-acts"/>
            </colgroup>
            <thead>
              <tr>
                <th>Institution</th><th>Status</th><th>Subscription</th>
                <th>Students</th><th>Questions</th><th>Exams</th>
                <th>Renewal</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="instTableBody">
              <tr><td colspan="8" style="text-align:center;color:var(--muted);padding:40px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div style="padding:12px 20px;border-top:1px solid var(--border);">
          <span id="tableFooter" style="font-size:0.82rem;color:var(--muted);">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm action modal -->
  <div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r);padding:28px;max-width:400px;width:90%;">
      <h3 id="confirmTitle" style="margin:0 0 10px;font-size:1.05rem;">Confirm Action</h3>
      <p id="confirmMsg" style="color:var(--muted);font-size:0.88rem;margin:0 0 20px;"></p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn-outline small" id="confirmCancelBtn">Cancel</button>
        <button class="btn-primary small" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script>
  (function() {
    'use strict';

    Auth.currentRole().then(function(user) {
      if (!user || (user.role !== 'admin' && user.role !== 'platform_admin')) {
        window.location.href = '/login';
      }
    }).catch(function(err) {
      console.log('[institutions] Auth check failed:', err);
      window.location.href = '/login';
    });

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .finally(function() { window.location.href = '/login'; });
    });

    var pendingAction = null;
    var allInstitutions = [];

    function statusBadge(s) {
      var styles = {
        active:'background:rgba(5,150,105,0.15);color:var(--green-l);',
        trial:'background:rgba(5,150,105,0.1);color:var(--green-l);',
        inactive:'background:rgba(107,114,128,0.15);color:var(--muted);',
        overdue:'background:rgba(217,119,6,0.15);color:var(--yellow-l);',
        grace_period:'background:rgba(217,119,6,0.12);color:var(--yellow-l);',
        expired:'background:rgba(220,38,38,0.12);color:var(--red-l);',
        none:'background:rgba(107,114,128,0.1);color:var(--muted2);',
      };
      return '<span style="' + (styles[s] || styles.none) + 'padding:2px 8px;border-radius:8px;font-size:0.72rem;font-weight:700;">' + (s || 'none') + '</span>';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) { return '—'; }
    }

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(str || ''));
      return d.innerHTML;
    }

    function loadInstitutions() {
      var status = document.getElementById('filterStatus').value;
      var url = '/api/admin/platform/institutions';
      if (status) url += '?subscription_status=' + encodeURIComponent(status);

      document.getElementById('instTableBody').innerHTML =
        '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:32px;">Loading…</td></tr>';

      fetch(url, { credentials: 'include' })
        .then(function(r) {
          if (!r.ok) {
            console.error('API error:', r.status, r.statusText);
            var errMsg = 'API error: ' + r.status;
            if (r.status === 403) errMsg += ' (Forbidden - check if logged in as platform_admin)';
            if (r.status === 401) errMsg += ' (Unauthorized - session may have expired)';
            throw new Error(errMsg);
          }
          return r.json();
        })
        .then(function(data) {
          console.log('Institutions data loaded:', data);
          allInstitutions = data.institutions || [];
          renderTable(allInstitutions);
        })
        .catch(function(err) {
          console.error('Load error:', err);
          document.getElementById('instTableBody').innerHTML =
            '<tr><td colspan="8" style="text-align:center;color:var(--red-l);padding:32px;">⚠️ Failed to load: ' + escapeHtml(err.message || 'Unknown error') + '</td></tr>';
        });
    }

    function renderTable(institutions) {
      document.getElementById('tableFooter').textContent = institutions.length + ' institution' + (institutions.length !== 1 ? 's' : '');
      var tbody = document.getElementById('instTableBody');

      if (institutions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:32px;">No institutions found</td></tr>';
        return;
      }

      tbody.innerHTML = institutions.map(function(inst) {
        var instId = inst.id || inst.institution_id;
        var subStatus = inst.subscription_status || 'inactive';
        var isActive = ['active', 'trial', 'overdue', 'grace_period'].indexOf(subStatus) !== -1;
        var toggleLabel = isActive ? 'Suspend' : 'Activate';
        var toggleStyle = isActive ? 'color:var(--red-l);border-color:var(--red-l);' : 'color:var(--green-l);border-color:var(--green-l);';
        var toggleAction = isActive ? 'suspend' : 'activate';

        return '<tr>' +
          '<td><div style="font-weight:600;font-size:0.87rem;">' + escapeHtml(inst.name) + '</div>' +
            '<div style="font-size:0.75rem;color:var(--muted);margin-top:2px;">' + escapeHtml(inst.contact_phone || '') + '</div></td>' +
          '<td>' + statusBadge(subStatus) + '</td>' +
          '<td style="font-size:0.8rem;color:var(--muted2);">' + escapeHtml(inst.plan_name || '—') + '</td>' +
          '<td style="text-align:center;">' + (inst.student_count || 0) + '</td>' +
          '<td style="text-align:center;">' + (inst.question_count || 0) + '</td>' +
          '<td style="text-align:center;">' + (inst.exam_count || 0) + '</td>' +
          '<td style="font-size:0.8rem;">' + fmtDate(inst.next_renewal_date) + '</td>' +
          '<td>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
              '<button class="btn-outline small" style="' + toggleStyle + '" ' +
                'onclick="doAction(\'' + toggleAction + '\',\'' + instId + '\',\'' + escapeHtml(inst.name) + '\')">' +
                toggleLabel +
              '</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    window.doAction = function(action, instId, instName) {
      pendingAction = { action: action, instId: instId };
      var msgs = {
        activate: 'Activate "' + instName + '"? This will restore their access.',
        suspend: 'Suspend "' + instName + '"? Their students will lose access.',
      };
      document.getElementById('confirmTitle').textContent = action === 'activate' ? 'Activate Institution' : 'Suspend Institution';
      document.getElementById('confirmMsg').textContent = msgs[action];
      var okBtn = document.getElementById('confirmOkBtn');
      okBtn.style.background = action === 'suspend' ? 'var(--red)' : '';
      okBtn.style.borderColor = action === 'suspend' ? 'var(--red)' : '';
      document.getElementById('confirmModal').style.display = 'flex';
    };

    document.getElementById('confirmCancelBtn').addEventListener('click', function() {
      pendingAction = null;
      document.getElementById('confirmModal').style.display = 'none';
    });

    document.getElementById('confirmOkBtn').addEventListener('click', function() {
      if (!pendingAction) return;
      var action = pendingAction.action;
      var instId = pendingAction.instId;
      pendingAction = null;
      document.getElementById('confirmModal').style.display = 'none';

      var url = '/api/admin/platform/institutions/' + instId + '/' + action;
      fetch(url, { method: 'POST', credentials: 'include' })
        .then(function(r) {
          if (r.ok) { loadInstitutions(); }
          else { return r.json().then(function(d) { alert((d && d.detail) || 'Action failed.'); }); }
        })
        .catch(function() { alert('Network error.'); });
    });

    document.getElementById('filterStatus').addEventListener('change', loadInstitutions);
    document.getElementById('refreshBtn').addEventListener('click', loadInstitutions);

    loadInstitutions();
  })();
  </script>
</body>
</html>
