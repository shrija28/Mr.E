<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKCET Prep — Redirecting</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="bg-mesh"></div>
  <p style="text-align:center;margin-top:40vh;color:var(--muted);">Redirecting…</p>
  <script src="../js/auth.js"></script>
  <script>
    // Legacy generator page has moved to the admin panel.
    // Auth-aware redirect: admins go to /admin/upload, everyone else to /.
    (async function () {
      var user = await Auth.currentRole();
      if (user && user.role === 'admin') {
        window.location.href = '/admin/upload';
      } else {
        window.location.href = '/';
      }
    })();
  </script>
</body>
</html>
