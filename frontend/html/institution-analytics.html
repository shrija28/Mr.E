<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mr.E — Institution Analytics</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
  <div class="bg-mesh"></div>

  <!-- Institution Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span class="brand-name">Mr.E<span class="brand-ai">Institution</span></span>
    </div>
    <div class="nav-links">
      <a href="/institution/dashboard" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/institution/students" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Students
      </a>
      <a href="/institution/upload" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
      </a>
      <a href="/institution/exams" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a href="/institution/analytics" class="nav-pill active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
      <a href="/institution/syllabus" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Syllabus
      </a>
      <a href="/institution/subscription" class="nav-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Subscription
      </a>
    </div>
    <div class="nav-actions">
      <a href="#" class="nav-pill" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-wrap">

    <!-- Summary Stats -->
    <div class="section-card">
      <div class="section-card-header">
        <div class="section-icon" style="background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(37,99,235,0.2));">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div>
          <h2>Performance Overview</h2>
          <p class="section-sub">Aggregated analytics for your institution's students</p>
        </div>
      </div>
      <div class="section-body">
        <div id="summaryStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">
          <div style="text-align:center;color:var(--muted);padding:32px;">Loading analytics…</div>
        </div>
      </div>
    </div>

    <!-- Student Leaderboard -->
    <div class="section-card">
      <div class="section-card-header">
        <div class="section-icon" style="background:linear-gradient(135deg,rgba(8,145,178,0.2),rgba(5,150,105,0.2));">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div>
          <h2>Student Leaderboard</h2>
          <p class="section-sub" id="studentCount">Loading students…</p>
        </div>
      </div>
      <div class="section-body" style="padding:0;">
        <div class="table-scroll">
          <table class="results-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Student</th>
                <th>Email</th>
                <th>Attempts</th>
                <th>Avg Score</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/auth.js"></script>
  <script src="../js/institution-access-control.js"></script>
  <script>
  (function () {
    'use strict';

    // ── Auth guard ───────────────────────────────────────────────────────
    Auth.currentRole().then(function (user) {
      if (!user || user.role !== 'institution_admin') {
        window.location.href = '/login';
      }
    });

    // ── Logout ───────────────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', function (e) {
      e.preventDefault();
      fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
        .finally(function() { window.location.href = '/login'; });
    });

    // ── Load Analytics ───────────────────────────────────────────────────
    function loadAnalytics() {
      fetch('/api/institution/content/analytics', { credentials: 'include' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          renderSummary(data);
          renderLeaderboard(data.students || []);
        })
        .catch(function () {
          document.getElementById('summaryStats').innerHTML =
            '<div style="text-align:center;color:var(--red-l);padding:32px;">Failed to load analytics</div>';
          document.getElementById('leaderboardBody').innerHTML =
            '<tr><td colspan="5" style="text-align:center;color:var(--red-l);padding:32px;">Failed to load</td></tr>';
        });
    }

    // ── Render Summary ───────────────────────────────────────────────────
    function renderSummary(data) {
      var container = document.getElementById('summaryStats');
      
      var stats = [
        { label: 'Total Students', value: data.total_students || 0, color: 'var(--blue-l)' },
        { label: 'Total Submissions', value: data.total_submissions || 0, color: 'var(--green-l)' },
        { label: 'Average Score', value: (data.average_score || 0).toFixed(1) + '%', color: 'var(--purple-l)' }
      ];

      container.innerHTML = stats.map(function(stat) {
        return '<div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--rm);padding:20px;text-align:center;">' +
          '<div style="font-size:0.85rem;color:var(--muted);margin-bottom:8px;">' + stat.label + '</div>' +
          '<div style="font-size:2rem;font-weight:700;color:' + stat.color + ';">' + stat.value + '</div>' +
        '</div>';
      }).join('');
    }

    // ── Render Leaderboard ───────────────────────────────────────────────
    function renderLeaderboard(students) {
      var tbody = document.getElementById('leaderboardBody');
      var countEl = document.getElementById('studentCount');

      if (students.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px;">No student data yet. Students need to take exams first.</td></tr>';
        countEl.textContent = '0 students';
        return;
      }

      countEl.textContent = students.length + ' student' + (students.length !== 1 ? 's' : '');

      tbody.innerHTML = students.map(function (student, index) {
        var rank = index + 1;
        var rankClass = rank <= 3 ? 'score-high' : '';
        var scoreClass = student.average_score >= 70 ? 'score-high' : (student.average_score >= 40 ? 'score-mid' : 'score-low');

        return '<tr>' +
          '<td><span class="score-badge ' + rankClass + '">#' + rank + '</span></td>' +
          '<td>' + escapeHtml(student.display_name || 'Unknown') + '</td>' +
          '<td style="color:var(--muted);">' + escapeHtml(student.email || '—') + '</td>' +
          '<td>' + (student.total_attempts || 0) + '</td>' +
          '<td><span class="score-badge ' + scoreClass + '">' + (student.average_score || 0).toFixed(1) + '%</span></td>' +
          '</tr>';
      }).join('');
    }

    // ── Helpers ──────────────────────────────────────────────────────────
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    // ── Init ─────────────────────────────────────────────────────────────
    loadAnalytics();
  })();
  </script>
</body>
</html>
